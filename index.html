
<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
</head>
<body>

    <h2>Login Form</h2>

    <form>
        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Address:</label>
        <textarea name="address" required></textarea>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <input type="submit" value="Login">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
